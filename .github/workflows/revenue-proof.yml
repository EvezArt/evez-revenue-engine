name: EVEZ Revenue Engine Proof CI
on:
  push:
  pull_request:
    branches: [main, master]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax and revenue-ledger invariants
        run: |
          set -e
          test -f README.md
          test -f sales_pipeline.py
          python -m py_compile sales_pipeline.py
          python sales_pipeline.py --help
          echo "EVEZ revenue engine proof: PASS"
